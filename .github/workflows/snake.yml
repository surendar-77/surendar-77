name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Same look as arifhaxn's snake (neutral empty cells, bright top level, lilac snake), in purple.
          # First dot color is the empty cell.
          outputs: |
            dist/snake-light.svg?color_snake=%237e22ce&color_dots=#ede9fe,#c4b5fd,#a78bfa,#7c3aed,#c026d3
            dist/snake-dark.svg?color_snake=%23c084fc&color_dots=#2a2438,#4c1d95,#7c3aed,#a78bfa,#e879f9

      - name: Speed up snake animation
        # snk has no speed option, so scale every animation duration (keyframe percentages stay the same).
        run: |
          sudo chown -R "$(id -u)" dist
          perl -pi -e 's/(\d+)ms/int($1 * 0.4) . "ms"/ge' dist/*.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
