name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # First dot color is the empty cell: a visible deep purple so the whole grid reads as filled.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7e22ce&color_dots=#ede9fe,#d8b4fe,#c084fc,#a855f7,#7e22ce
            dist/github-contribution-grid-snake-dark.svg?color_snake=#e9d5ff&color_dots=#2e1065,#5b21b6,#7e22ce,#a855f7,#d8b4fe&color_background=#0b0613

      - name: Speed up snake animation
        # snk has no speed option, so scale every animation duration (keyframe percentages stay the same).
        run: |
          sudo chown -R "$(id -u)" dist
          perl -pi -e 's/(\d+)ms/int($1 * 0.4) . "ms"/ge' dist/*.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
