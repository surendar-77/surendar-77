name: Generate projects panel

on:
  push:
    branches: [main]
    paths:
      - "projects.json"
      - "scripts/generate_projects.py"
      - ".github/workflows/projects.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate projects SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_projects.py projects.json out

      - name: Push to projects branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: projects
          build_dir: out
          commit_message: "Update projects panel [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
